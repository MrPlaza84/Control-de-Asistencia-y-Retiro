<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Pro | Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        /* Glassmorphism Effect */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
        }

        /* Header & Time */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #reloj {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Profile Section */
        .profile-card { text-align: center; }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .status-indicator {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .in-job { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .out-job { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        /* Buttons Grid */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 0.9rem;
        }

        .btn i { font-size: 1.8rem; }
        .btn:hover:not(:disabled) { transform: translateY(-5px); filter: brightness(1.1); }
        .btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .btn-entry { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3); }
        .btn-exit { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); }
        .btn-break { background: linear-gradient(135deg, #f59e0b, #d97706); grid-column: span 2; }

        /* Table Style */
        .history-card { margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { color: var(--text-muted); text-align: left; padding: 12px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        td { padding: 15px 12px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .tag { font-family: monospace; color: var(--primary); background: rgba(99, 102, 241, 0.1); padding: 2px 6px; border-radius: 4px; }

        /* Animation */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .live-dot { height: 8px; width: 8px; background: var(--success); border-radius: 50%; display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }
    </style>
</head>
<body>

<div class="dashboard">
    <header class="header glass">
        <div>
            <h1 style="font-size: 1.2rem;">Attendance<span style="color:var(--primary)">Pro</span></h1>
            <p style="color:var(--text-muted); font-size: 0.8rem;"><span class="live-dot"></span> Sincronizado con Servidor Central</p>
        </div>
        <div id="reloj">00:00:00</div>
    </header>

    <aside class="glass profile-card">
        <img src="https://ui-avatars.com/api/?name=Juan+Perez&background=6366f1&color=fff" class="avatar">
        <h2>Juan Pérez</h2>
        <p style="color:var(--text-muted)">ID: #992831</p>
        <div id="status-tag" class="status-indicator out-job">Fuera de Turno</div>
        <div style="margin-top: 30px; text-align: left;">
            <p style="font-size: 0.8rem; color: var(--text-muted);">HORAS HOY</p>
            <p style="font-size: 1.8rem; font-weight: 800;" id="total-hrs">0.00</p>
        </div>
    </aside>

    <main>
        <div class="glass controls">
            <button id="entry" class="btn btn-entry" onclick="action('ENTRADA')">
                <i>📥</i> ENTRADA
            </button>
            <button id="exit" class="btn btn-exit" onclick="action('SALIDA')" disabled>
                <i>📤</i> SALIDA
            </button>
            <button id="break" class="btn btn-break" onclick="action('RETIRO')" disabled>
                <i>🚶</i> SOLICITAR RETIRO TEMPORAL
            </button>
        </div>

        <div class="glass history-card">
            <h3>Actividad Reciente</h3>
            <table>
                <thead>
                    <tr>
                        <th>EVENTO</th>
                        <th>HORA EXACTA</th>
                        <th>ID TRANSACCIÓN</th>
                    </tr>
                </thead>
                <tbody id="log">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    let startTime = null;

    function updateClock() {
        document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    function action(type) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString();
        const txId = 'TX-' + Math.floor(Math.random()*1000000);

        if(type === 'ENTRADA') {
            startTime = now;
            toggleState(true);
        } else if(type === 'SALIDA') {
            const diff = (now - startTime) / (1000 * 60 * 60);
            document.getElementById('total-hrs').innerText = diff.toFixed(2);
            toggleState(false);
        }

        const row = `<tr>
            <td style="font-weight:bold; color:${type === 'ENTRADA' ? '#22c55e' : '#ef4444'}">${type}</td>
            <td>${timeStr}</td>
            <td><span class="tag">${txId}</span></td>
        </tr>`;
        
        document.getElementById('log').insertAdjacentHTML('afterbegin', row);
    }

    function toggleState(isIn) {
        document.getElementById('entry').disabled = isIn;
        document.getElementById('exit').disabled = !isIn;
        document.getElementById('break').disabled = !isIn;
        
        const tag = document.getElementById('status-tag');
        tag.innerText = isIn ? 'En Jornada' : 'Fuera de Turno';
        tag.className = 'status-indicator ' + (isIn ? 'in-job' : 'out-job');
    }
</script>

</body>
</html>
