<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fungang | Dashboard</title>
    <style>
        :root {
            --primary: #ffffff;
            --success: #ecfff3;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        .hidden { display: none !important; }

        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            z-index: 10;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: left;
        }

        .login-card h2 { margin-bottom: 24px; font-size: 2rem; }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label { font-size: 0.95rem; color: var(--text-muted); }

        .form-group input {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(129, 140, 248, 0.8);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-size: 1rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.25);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #reloj {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .profile-card { text-align: center; }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .status-indicator {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .in-job { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        .out-job { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .break-job { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 0.9rem;
        }

        .btn i { font-size: 1.8rem; }
        .btn:hover:not(:disabled) { transform: translateY(-5px); filter: brightness(1.1); }
        .btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .btn-entry { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3); }
        .btn-exit { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); }
        .btn-break { background: linear-gradient(135deg, #f59e0b, #d97706); grid-column: span 2; }

        .history-card { margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { color: var(--text-muted); text-align: left; padding: 12px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        td { padding: 15px 12px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .tag { font-family: monospace; color: var(--primary); background: rgba(99, 102, 241, 0.1); padding: 2px 6px; border-radius: 4px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .live-dot { height: 8px; width: 8px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }

        /* --- ESTILOS DEL MODAL --- */
        dialog {
            margin: auto;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: rgba(30, 41, 59, 0.98);
            backdrop-filter: blur(20px);
            color: var(--text);
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        
        dialog::backdrop {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
        }

        .modal-textarea {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            margin: 20px 0;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-m { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-m-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-m-send { background: var(--danger); color: white; }

        /* Estilos para la barra de scroll en la sección de perfiles */
        .profiles-container {
            max-height: 500px;
            overflow-y: scroll;
            padding-right: 10px;
        }

        .profiles-container::-webkit-scrollbar {
            width: 10px;
        }

        .profiles-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .profiles-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .profiles-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="glass login-card">
        <h2>Iniciar sesión</h2>
        <form onsubmit="attemptLogin(event)">
            <div class="form-group">
                <label for="user">Usuario</label>
                <input id="user" type="text" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="pass">Contraseña</label>
                <input id="pass" type="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

    </div>
</div>

        <p style=position:fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--text-muted); font-size: 0.8rem; z-index: 5; margin-top: 10px;>Copyright Fungang©2026</p> 

<div id="profileSelection" class="login-screen hidden">
    <div class="glass login-card">
        <h2>Seleccionar Perfil</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Elige un perfil para continuar:</p>
        <div class="profiles-container">
            <button class="btn-login" onclick="selectProfile('Winding Gaster', 'Img/gaster.png', '#ffffff')">Winding Gaster</button>
            <button class="btn-login" onclick="selectProfile('Liam Van Luuk', 'Img/Liam.png', '#ef4444')" style="margin-top: 10px;">Liam Van Luuk</button>
            <button class="btn-login" onclick="selectProfile('Xhasnaphar', 'Img/Xhasna.png', '#f59e0b')" style="margin-top: 10px;">Xhasnaphar</button>
            <button class="btn-login" onclick="selectProfile('Maximiliano Plaza', 'Img/Icono.png', '#ffffff')" style="margin-top: 10px;">Maximiliano Plaza</button>
            <button class="btn-login" onclick="selectProfile('Manuel Navarrete', 'Img/Kurt Cobain.png', '#efa94a')" style="margin-top: 10px;">Manuel Navarrete</button>
            <button class="btn-login" onclick="selectProfile('Josue Silva', 'Img/Icono.png', '#94a3b8')" style="margin-top: 10px;">Josue Silva</button>
            <button class="btn-login" onclick="selectProfile('Chris Novoselic', 'Img/Chris Novoselic.png', '#FFFFFF')" style="margin-top: 10px;">Chris Novoselic</button>
            <button class="btn-login" onclick="selectProfile('Dave Grohl', 'Img/Dave.jpg', '#000000')" style="margin-top: 10px;">Dave Grohl</button>
            <button class="btn-login" onclick="selectProfile('Dark Vader', 'Img/Dark Vader.png', '#FFFFFF')" style="margin-top: 10px;">Dark Vader</button>
            <button class="btn-login" onclick="selectProfile('Obi Wan Kenobi', 'Img/Obi Wan Kenobi.png', '#0EA5E9')" style="margin-top: 10px;">Obi Wan Kenobi</button>
            <button class="btn-login" onclick="selectProfile('Cliff Burton', 'Img/CliffBurton.png', '#559CE6')" style="margin-top: 10px;">Cliff Burton</button>
            <button class="btn-login" onclick="selectProfile('Nicolas Tesla', 'Img/Tesla.png', '#5E35DE')" style="margin-top: 10px;">Nicolas Tesla</button>
            <button class="btn-login" onclick="selectProfile('Jotaro Kujo', 'Img/Jotaro.webp', '#7D42FF')" style="margin-top: 10px;">Jotaro Kujo</button>
            <button class="btn-login" onclick="selectProfile('Albert Einstein', 'Img/Einstein.png', '#6B7280')" style="margin-top: 10px;">Albert Einstein</button>
            <button class="btn-login" onclick="selectProfile('Marilyn Manson', 'Img/Manson.png', '#381F70')" style="margin-top: 10px;">Marilyn Manson</button>
            <button class="btn-login" onclick="selectProfile('Donald Trump', 'Img/Trump.png', '#FFC87A')" style="margin-top: 10px;">Donald Trump</button>
            <button class="btn-login" onclick="selectProfile('Mickey Mouse', 'Img/Mickey.png', '#FF0000')" style="margin-top: 10px;">Mickey Mouse</button>
            <button class="btn-login" onclick="selectProfile('Trooper', 'Img/Trooper.png', '#FFFFFF')" style="margin-top: 10px;">Trooper</button>
            <button class="btn-login" onclick="selectProfile('Goofy', 'Img/Goofy.png', '#68FF00')" style="margin-top: 10px;">Goofy</button>
            <button class="btn-login" onclick="selectProfile('Administrador', 'Img/Icono.png', '#818cf8')" style="margin-top: 10px;">Administrador</button>
        </div>
    </div>
</div>

<div id="dashboard" class="dashboard hidden">
    <header class="header glass">
        <div>
            <h1 style="font-size: 1.2rem;">Attendance<span style="color:var(--primary)">Pro</span></h1>
            <p style="color:var(--text-muted); font-size: 0.8rem;"><span class="live-dot"></span> Sincronizado con Servidor Central</p>
        </div>
        <div id="reloj">00:00:00</div>
    </header>

    <aside class="glass profile-card">
        <img src="Img/gaster.png" class="avatar" alt="Avatar" id="profileImg">
        <h2 id="profileName">Winding Gaster</h2>
        <p style="color:var(--text-muted)">ID: #992831</p>
        <div id="status-tag" class="status-indicator out-job">Fuera de Turno</div>
        <div style="margin-top: 30px; text-align: left;">
            <p style="font-size: 0.8rem; color: var(--text-muted);">HORAS HOY</p>
            <p style="font-size: 1.8rem; font-weight: 800;" id="total-hrs">0.00</p>
        </div>
    </aside>

    <main>
        <div class="glass controls">
            <button id="entry" class="btn btn-entry" onclick="action('ENTRADA')">
                <i>📥</i> <span id="entry-text">ENTRADA</span>
            </button>
            <!-- Botón de Salida ahora abre el modal -->
            <button id="exit" class="btn btn-exit" onclick="openExitModal()" disabled>
                <i>📤</i> SALIDA
            </button>
            <button id="break" class="btn btn-break" onclick="action('RETIRO')" disabled>
                <i>🚶</i> SOLICITAR RETIRO TEMPORAL 
            </button>
        </div>

        <div class="glass history-card">
            <h3>Actividad Reciente</h3>
            <table>
                <thead>
                    <tr>
                        <th>EVENTO</th>
                        <th>HORA EXACTA</th>
                        <th>ID TRANSACCIÓN</th>
                    </tr>
                </thead>
                <tbody id="log"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- Estructura del Modal -->
<dialog id="exitModal">
    <h2 style="text-align: center;">Decir lo que hizo</h2>
    <textarea id="exitTask" class="modal-textarea" placeholder="Resumen de actividades realizadas..."></textarea>
    <div class="modal-actions">
        <button class="btn-m btn-m-cancel" onclick="closeExitModal()">Cancelar</button>
        <button class="btn-m btn-m-send" onclick="confirmExit()">Enviar y Salir</button>
    </div>
</dialog>

<script>
    let startTime = null;
    let totalHours = 0;
    let inRetiro = false;

    // --- LÓGICA DEL CÓDIGO KONAMI ---
    const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let currentInput = [];

    document.addEventListener('keydown', (e) => {
        let key = e.key;
        if (key === 'B' || key === 'b') key = 'b';
        if (key === 'A' || key === 'a') key = 'a';
        currentInput.push(key);
        currentInput = currentInput.slice(-konamiCode.length);
        if (JSON.stringify(currentInput) === JSON.stringify(konamiCode)) {
            activateAdmin();
        }
    });

    function activateAdmin() {
        alert("¡Código Konami activado! Acceso Administrador concedido.");
        showProfileSelection();
    }

    function showProfileSelection() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('profileSelection').classList.remove('hidden');
    }

    function selectProfile(name, avatarUrl, borderColor) {
        document.getElementById('profileSelection').classList.add('hidden');
        loginSuccess(name, avatarUrl, borderColor);
    }

    // --- LÓGICA DE LOGIN ---

    function attemptLogin(event) {
        event.preventDefault();
        const user = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value.trim();
        
        if (user === 'Winding Gaster' && pass === 'Th3Tru3R0yalScIentistWDG4ster') {
            loginSuccess(user, "Img/gaster.png", "#ffffff");
        } 
        else if (user === 'Liam Van Luuk' && pass === 'SigrunScalibur123') {
            loginSuccess(user, "Img/Liam.png", "#ef4444");
        }
        else if (user === 'Xhasnaphar' && pass === 'KaosXhasna1234') {
            loginSuccess(user, "Img/Xhasna.png", "#f59e0b");
        }
        else if (user === 'Maximiliano Plaza' && pass === 'Contraseñaxd') {
            loginSuccess(user, "Img/Icono.png", "#ffffff");
        }

        else if (user === 'Manuel Navarrete' && pass ===  'kurt donald cobain') {
            loginSuccess(user, "Img/Kurt Cobain.png", "#efa94a");
            
        }

        else if (user === 'Josue Silva' && pass === 'jojos' ) {
            loginSuccess(user, "Img/Icono.png", "#818cf8");
        }

        else if (user === 'Chris Novoselic' && pass === 'chris novoselic') {
            loginSuccess(user, "Img/Chris Novoselic.png", "#FFFFFF");
        }

        else if (user === 'Dave Grohl' && pass === 'dave grohl') {
            loginSuccess(user, "Img/Dave.jpg", "#000000");
        }

        else if (user === 'Dark Vader' && pass === 'Yosoytupadre') {
            loginSuccess(user, "Img/Dark Vader.png", "#FFFFFF");
        }
        
        else if (user === 'Obi Wan Kenobi' && pass === 'HelloThere') {
            loginSuccess(user, "Img/Obi Wan Kenobi.png", "#0EA5E9");
        }

        else if (user === 'Cliff Burton' && pass === 'Metallica123') {
            loginSuccess(user, "Img/CliffBurton.png", "#559CE6");
        }

        else if (user === 'Nicolas Tesla' && pass === 'EdisonEsUnLadrón') {
            loginSuccess(user, "Img/Tesla.png", "#5E35DE");
        }

        else if (user === 'Jotaro Kujo' && pass === 'YareYareDaze') {
            loginSuccess(user, "Img/Jotaro.webp", "#7D42FF");
        }

        else if (user === 'Albert Einstein' && pass === 'Relativity123') {
            loginSuccess(user, "Img/Einstein.png", "#6B7280");
        }

        else if (user === 'Marilyn Manson' && pass === 'MarilynManson123') {
            loginSuccess(user, "Img/Manson.png", "#381F70");
        }

         else if (user === 'Administrador' && pass === 'AdminAccess2024') {
            loginSuccess(user, "Img/Icono.png", "#818cf8");
        }

        else if (user === 'Donald Trump' && pass === 'MakeAmericaGreatAgain') {
            loginSuccess(user, "Img/Trump.png", "#FFC87A");
        }

        else if (user === 'Mickey Mouse' && pass === 'Disney123') {
            loginSuccess(user, "Img/Mickey.png", "#FF0000");
        }
        
        else if (user === 'Trooper' && pass === 'Storm123') {
            loginSuccess(user, "Img/Trooper.png", "#FFFFFF");
        }

        else if (user === 'Goofy' && pass === 'Goofy123') {
            loginSuccess(user, "Img/Goofy.png", "#68FF00");
        }
        else {
            alert('Usuario o contraseña incorrectos.');
        }
    }

    function loginSuccess(name, avatarUrl, borderColor) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        const profileImg = document.getElementById('profileImg');
        document.getElementById('profileName').innerText = name;
        profileImg.src = avatarUrl;
        profileImg.style.borderColor = borderColor;
        profileImg.style.boxShadow = `0 0 20px ${borderColor}66`;
        startTime = null;
        totalHours = 0;
        inRetiro = false;
        document.getElementById('total-hrs').innerText = "0.00";
        document.getElementById('log').innerHTML = "";
        setStatus('Fuera de Turno');
    }

    // --- FUNCIONES DE RELOJ ---
    function updateClock() {
        document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    // --- LÓGICA DEL MODAL DE SALIDA ---
    function openExitModal() {
        document.getElementById('exitTask').value = '';
        document.getElementById('exitModal').showModal();
    }

    function closeExitModal() {
        document.getElementById('exitModal').close();
    }

    function confirmExit() {
        const note = document.getElementById('exitTask').value;
        closeExitModal();
        action('SALIDA', note);
    }

    // --- MANEJO DE ACCIONES ---
    function action(type, note = '') {
        const now = new Date();
        const timeStr = now.toLocaleTimeString();
        const txId = 'TX-' + Math.floor(Math.random()*1000000);

        if(type === 'ENTRADA') {
            startTime = now;
            inRetiro = false;
            setStatus('En Jornada');
        } else if(type === 'RETIRO') {
            if (startTime && !inRetiro) {
                inRetiro = true;
                const cycleDiff = (now - startTime) / (1000 * 60 * 60);
                totalHours += cycleDiff;
                document.getElementById('total-hrs').innerText = totalHours.toFixed(2);
                setStatus('En Retiro Temporal');
            }
        } else if(type === 'SALIDA') {
            if (startTime && !inRetiro) {
                const diff = (now - startTime) / (1000 * 60 * 60);
                totalHours += diff;
                document.getElementById('total-hrs').innerText = totalHours.toFixed(2);
            }
            startTime = null;
            inRetiro = false;
            setStatus('Fuera de Turno');
        }

        let colorHex = '#22c55e'; 
        if(type === 'SALIDA') colorHex = '#ef4444';
        if(type === 'RETIRO') colorHex = '#f59e0b';

        // Estilo para la nota en el historial
        let noteHtml = note.trim() !== '' ? `<br><small style="color:var(--text-muted); font-weight:normal;">📝 ${note}</small>` : '';

        const row = `<tr>
            <td style="font-weight:bold; color:${colorHex}">${type}${noteHtml}</td>
            <td>${timeStr}</td>
            <td><span class="tag">${txId}</span></td>
        </tr>`;
        document.getElementById('log').insertAdjacentHTML('afterbegin', row);
    }

    function setStatus(status) {
        const tag = document.getElementById('status-tag');
        const entryBtn = document.getElementById('entry');
        const entryText = document.getElementById('entry-text');
        const exitBtn = document.getElementById('exit');
        const breakBtn = document.getElementById('break');

        tag.innerText = status;
        
        if (status === 'En Jornada') {
            tag.className = 'status-indicator in-job';
            entryText.innerText = "ENTRADA"; 
            entryBtn.disabled = true;
            exitBtn.disabled = false;
            breakBtn.disabled = false;
        } else if (status === 'En Retiro Temporal') {
            tag.className = 'status-indicator break-job';
            entryText.innerText = "REANUDAR"; 
            entryBtn.disabled = false; 
            exitBtn.disabled = false;  
            breakBtn.disabled = true;
        } else if (status === 'Fuera de Turno') {
            tag.className = 'status-indicator out-job';
            entryText.innerText = "ENTRADA";
            entryBtn.disabled = false;
            exitBtn.disabled = true;
            breakBtn.disabled = true;
        }
    }

</script>

</body>
</html>
